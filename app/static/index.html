<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Judge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    select, button { padding: 10px 12px; font-size: 14px; }
    textarea { width: 100%; height: 360px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    pre { background:#f6f8fa; padding: 12px; white-space: pre-wrap; border-radius: 8px; }
    .muted { color: #666; font-size: 13px; }
    .card { border:1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .pill { display:inline-block; padding:6px 10px; border:1px solid #e5e7eb; border-radius:999px; font-size:13px; margin-right:8px; background:#fafafa; }
    h1 { margin: 0 0 8px; }
    h2 { margin: 8px 0 10px; }
  </style>
</head>
<body>
  <h1>Mini Judge</h1>
  <p class="muted">문제 선택 → 코드 제출 → 결과 확인</p>

  <div class="row" style="margin-top:12px;">
    <label><b>Problem</b></label>
    <select id="problemSelect"></select>

    <label><b>Language</b></label>
    <select id="langSelect"></select>

    <button id="refreshBtn">새로고침</button>
    <span id="statusText" class="muted"></span>
  </div>

  <div class="card" id="problemCard">
    <h2 id="problemTitle">(no problem)</h2>
    <div style="margin-bottom:10px;">
      <span class="pill" id="timePill">Time: -</span>
      <span class="pill" id="memPill">Memory: -</span>
      <span class="pill" id="samplePill">Samples: -</span>
    </div>

    <h3 style="margin: 12px 0 8px;">문제 설명</h3>
    <pre id="statementBox">(no statement)</pre>

    <h3 style="margin: 12px 0 8px;">예제</h3>
    <div id="samplesBox" class="muted">(no samples)</div>
  </div>

  <h3 style="margin-top:18px;">Code</h3>
  <textarea id="codeArea">print("Hello")</textarea>

  <div class="row" style="margin-top:12px;">
    <button id="submitBtn">Submit</button>
    <span class="muted" id="submitState">Ready</span>
  </div>

  <h3>Result</h3>
  <pre id="resultBox">(no result)</pre>

<script>
  const problemSelect = document.getElementById('problemSelect');
  const langSelect = document.getElementById('langSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const submitBtn = document.getElementById('submitBtn');

  const statusText = document.getElementById('statusText');
  const submitState = document.getElementById('submitState');
  const resultBox = document.getElementById('resultBox');
  const codeArea = document.getElementById('codeArea');

  const problemTitle = document.getElementById('problemTitle');
  const timePill = document.getElementById('timePill');
  const memPill = document.getElementById('memPill');
  const samplePill = document.getElementById('samplePill');
  const statementBox = document.getElementById('statementBox');
  const samplesBox = document.getElementById('samplesBox');

  let problemsCache = []; // [{id,title,languages,default_language}...]

  function esc(s) {
    return (s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function loadProblems() {
    statusText.textContent = 'Loading problems...';
    const res = await fetch('/problems');
    if (!res.ok) {
      statusText.textContent = 'Failed to load problems';
      return;
    }
    const data = await res.json();
    problemsCache = data.problems || [];

    problemSelect.innerHTML = '';
    problemsCache.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.id} — ${p.title}`;
      problemSelect.appendChild(opt);
    });

    if (problemsCache.length === 0) {
      statusText.textContent = 'No problems found';
      renderEmpty();
      return;
    }

    statusText.textContent = 'Ready';
    await loadProblemDetail(problemSelect.value);
  }

  function renderEmpty() {
    problemTitle.textContent = '(no problem)';
    timePill.textContent = 'Time: -';
    memPill.textContent = 'Memory: -';
    samplePill.textContent = 'Samples: -';
    statementBox.textContent = '(no statement)';
    samplesBox.textContent = '(no samples)';
    langSelect.innerHTML = '';
  }

  function renderSamples(samples) {
    if (!samples || samples.length === 0) {
      samplesBox.textContent = '(no samples)';
      return;
    }
    samplesBox.innerHTML = samples.map(s => `
      <div style="margin: 10px 0; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px;">
        <div class="muted" style="margin-bottom:6px;">Sample #${s.n}</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div>
            <div class="muted">Input</div>
            <pre style="margin:6px 0 0;">${esc(s.in)}</pre>
          </div>
          <div>
            <div class="muted">Output</div>
            <pre style="margin:6px 0 0;">${esc(s.out)}</pre>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function loadProblemDetail(problemId) {
    statusText.textContent = 'Loading problem detail...';

    const res = await fetch(`/problems/${encodeURIComponent(problemId)}`);
    if (!res.ok) {
      statusText.textContent = 'Failed to load problem detail';
      renderEmpty();
      return;
    }

    const p = await res.json();

    problemTitle.textContent = `${p.title} (${p.id})`;
    timePill.textContent = `Time: ${p.time_limit_ms} ms`;
    memPill.textContent = `Memory: ${p.memory_limit_mb} MB`;
    samplePill.textContent = `Samples: ${p.sample_count}`;

    statementBox.textContent = (p.statement_md && p.statement_md.trim()) ? p.statement_md : '(no statement)';
    renderSamples(p.samples);

    // language select
    langSelect.innerHTML = '';
    (p.languages || []).forEach(lang => {
      const opt = document.createElement('option');
      opt.value = lang;
      opt.textContent = lang;
      langSelect.appendChild(opt);
    });

    if (p.default_language) {
      langSelect.value = p.default_language;
    }

    statusText.textContent = 'Ready';
  }

  async function pollResult(sid) {
    while (true) {
      const res = await fetch(`/submissions/${sid}`);
      const data = await res.json();
      submitState.textContent = `Status: ${data.status || ''}`;
      resultBox.textContent = JSON.stringify(data, null, 2);
      if (data.status && data.status !== 'QUEUED' && data.status !== 'RUNNING') break;
      await new Promise(r => setTimeout(r, 700));
    }
  }

  async function submit() {
    const pid = problemSelect.value;
    if (!pid) {
      alert('문제가 없습니다.');
      return;
    }

    submitBtn.disabled = true;
    submitState.textContent = 'Submitting...';
    resultBox.textContent = '(submitting...)';

    // 지금은 code만 보내고, 나중에 언어 선택까지 서버에 반영하려면 body에 lang도 같이 실어주면 됨
    const res = await fetch(`/problems/${encodeURIComponent(pid)}/submit`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ code: codeArea.value })
    });

    if (!res.ok) {
      const t = await res.text();
      submitBtn.disabled = false;
      submitState.textContent = 'Submit failed';
      resultBox.textContent = t;
      return;
    }

    const data = await res.json();
    const sid = data.submission_id;
    submitState.textContent = `Submitted: ${sid}`;
    await pollResult(sid);
    submitBtn.disabled = false;
  }

  refreshBtn.addEventListener('click', loadProblems);
  problemSelect.addEventListener('change', () => loadProblemDetail(problemSelect.value));
  submitBtn.addEventListener('click', submit);

  loadProblems();
</script>
</body>
</html>
