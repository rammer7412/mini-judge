<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Judge</title>

  <!-- CSS 분리 -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Mini Judge</h1>
  <p class="muted">문제 선택 → 코드 제출 → 결과 확인</p>

  <!-- Top controls (Refresh removed) -->
  <div class="row" style="margin: 12px 0 18px;">
    <label><b>Problem</b></label>
    <select id="problemSelect"></select>

    <label><b>Language</b></label>
    <select id="langSelect"></select>

    <label><b>Name</b></label>
    <input id="userNameInput" type="text" placeholder="이름" maxlength="32" />

    <span id="statusText" class="muted"></span>
  </div>

  <!-- Problem statement area -->
  <div class="card grid" id="problemCard">
    <div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:baseline;">
        <h2 id="problemTitle" style="margin:0;">(no problem)</h2>
        <span class="muted" id="problemId"></span>
      </div>
      <div class="meta" style="margin-top:8px;">
        <span class="pill" id="timeLimitPill">Time: -</span>
        <span class="pill" id="memLimitPill">Memory: -</span>
      </div>
    </div>

    <div>
      <h3 style="margin-top:0;">문제 설명</h3>
      <div class="statement" id="statementBox">(no statement)</div>
    </div>

    <div class="samples">
      <h3 style="margin-top:0;">예제</h3>
      <div id="samplesBox" class="muted">(no samples)</div>
    </div>
  </div>

  <!-- Code -->
  <h2>Code</h2>
  <textarea id="codeArea">print("Hello")</textarea>

  <div class="toolbar">
    <button id="submitBtn">Submit</button>
    <span class="muted small">제출하면 채점이 끝날 때까지 버튼이 비활성화됩니다.</span>
  </div>

  <!-- Result -->
  <h2>Result</h2>
  <div class="card" id="resultCard">
    <div class="result-grid">
      <div class="result-row">
        <div class="result-label">Problem</div>
        <div class="result-value" id="resultProblem">-</div>
      </div>
      <div class="result-row">
        <div class="result-label">User Name</div>
        <div class="result-value" id="resultUser">-</div>
      </div>
      <div class="result-row">
        <div class="result-label">Result</div>
        <div class="result-value result-code muted" id="resultCode">-</div>
      </div>
    </div>

    <div class="muted small" id="resultDesc" style="margin-top:10px;">
      AC: 정답 / WA: 오답 / TLE: 시간 초과 / MLE: 메모리 초과 / RE: 런타임 에러 / CE: 컴파일 에러 / IE: 내부 오류
    </div>

    <details id="resultDetailWrap" style="margin-top:10px; display:none;">
      <summary class="muted small">자세히 보기</summary>
      <pre id="resultDetail" style="margin-top:8px;">(no detail)</pre>
    </details>
  </div>


  <script type="module" src="/static/app.js"></script>
</body>
</html>
