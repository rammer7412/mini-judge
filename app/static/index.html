<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Judge</title>
  <style>
    :root { color-scheme: light; }

    /* Blue-ish theme */
    body {
      font-family: system-ui, sans-serif;
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
      line-height: 1.5;
      background: #f5f8ff;
    }

    h1 { margin: 0 0 8px; }
    h2 { margin: 24px 0 8px; }
    h3 { margin: 18px 0 8px; }

    .muted { color: #51607a; font-size: 13px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    select, button { padding: 10px 12px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 360px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      box-sizing: border-box;
      border: 1px solid #dbe6ff;
      border-radius: 10px;
      background: #ffffff;
    }

    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre {
      background: #eef4ff;
      padding: 12px;
      white-space: pre-wrap;
      border: 1px solid #dbe6ff;
      border-radius: 8px;
      overflow: auto;
    }

    .card {
      border: 1px solid #dbe6ff;
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(10, 30, 80, 0.04);
    }
    .grid { display: grid; gap: 12px; }
    .meta { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    .pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef4ff;
      border: 1px solid #dbe6ff;
    }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 780px){ .two { grid-template-columns: 1fr; } }

    .toolbar { margin-top: 10px; display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .danger { color: #b42318; }
    .ok { color: #067647; }
    .small { font-size: 12px; }

    .samples .sample-title { margin: 12px 0 6px; font-weight: 700; }
    .statement { white-space: pre-wrap; }
    .result-header { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

    button {
      background: #ffffff;
      border: 1px solid #dbe6ff;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #eef4ff; }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h1>Mini Judge</h1>
  <p class="muted">문제 선택 → 코드 제출 → 결과 확인</p>

  <!-- Top controls (Refresh removed) -->
  <div class="row" style="margin: 12px 0 18px;">
    <label><b>Problem</b></label>
    <select id="problemSelect"></select>

    <label><b>Language</b></label>
    <select id="langSelect"></select>

    <span id="statusText" class="muted"></span>
  </div>

  <!-- Problem statement area -->
  <div class="card grid" id="problemCard">
    <div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:baseline;">
        <h2 id="problemTitle" style="margin:0;">(no problem)</h2>
        <span class="muted" id="problemId"></span>
      </div>
      <div class="meta" style="margin-top:8px;">
        <span class="pill" id="timeLimitPill">Time: -</span>
        <span class="pill" id="memLimitPill">Memory: -</span>
        <span class="pill" id="sampleCountPill">Samples: -</span>
      </div>
    </div>

    <div>
      <h3 style="margin-top:0;">문제 설명</h3>
      <div class="statement" id="statementBox">(no statement)</div>
    </div>

    <div class="samples">
      <h3 style="margin-top:0;">예제</h3>
      <div id="samplesBox" class="muted">(no samples)</div>
    </div>
  </div>

  <!-- Code -->
  <h2>Code</h2>
  <textarea id="codeArea">print("Hello")</textarea>

  <div class="toolbar">
    <button id="submitBtn">Submit</button>
    <span class="muted small">제출 후 자동으로 결과를 폴링합니다. (폴링 중 재제출하면 이전 폴링은 중단됩니다.)</span>
  </div>

  <!-- Result -->
  <h2>Result</h2>
  <div class="card">
    <div class="result-header">
      <div class="muted" id="resultHint">아직 제출하지 않았습니다.</div>
      <div class="muted small" id="lastSid"></div>
    </div>
    <pre id="resultBox">(no result)</pre>
  </div>

<script>
  const problemSelect = document.getElementById('problemSelect');
  const langSelect = document.getElementById('langSelect');
  const submitBtn = document.getElementById('submitBtn');
  const codeArea = document.getElementById('codeArea');
  const statusText = document.getElementById('statusText');

  const problemTitle = document.getElementById('problemTitle');
  const problemId = document.getElementById('problemId');
  const timeLimitPill = document.getElementById('timeLimitPill');
  const memLimitPill = document.getElementById('memLimitPill');
  const sampleCountPill = document.getElementById('sampleCountPill');

  const statementBox = document.getElementById('statementBox');
  const samplesBox = document.getElementById('samplesBox');

  const resultHint = document.getElementById('resultHint');
  const resultBox = document.getElementById('resultBox');
  const lastSid = document.getElementById('lastSid');

  const STATUS_TO_UI = {
    // 진행중
    QUEUED: { label: 'Queued', cls: 'muted', done: false },
    RUNNING: { label: 'Running', cls: 'muted', done: false },

    // 최종 판정
    ACCEPTED: { label: 'Correct', cls: 'ok', done: true },
    WRONG_ANSWER: { label: 'Wrong', cls: 'danger', done: true },
    TIME_LIMIT_EXCEEDED: { label: 'Timeout', cls: 'danger', done: true },
    MEMORY_LIMIT_EXCEEDED: { label: 'Memory Limit', cls: 'danger', done: true },
    RUNTIME_ERROR: { label: 'Error', cls: 'danger', done: true },
    COMPILATION_ERROR: { label: 'Compile Error', cls: 'danger', done: true },
    INTERNAL_ERROR: { label: 'Error', cls: 'danger', done: true },
  };

  let problemsCache = [];
  let currentProblemInfo = null;

  // AbortController for polling cancellation
  let currentPollAbort = null;

  function escapeHtml(s) {
    return (s ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  async function loadProblems() {
    statusText.textContent = 'Loading problems...';
    try {
      const res = await fetch('/problems');
      const data = await res.json();

      problemsCache = data.problems || [];
      problemSelect.innerHTML = '';

      for (const p of problemsCache) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.id}. ${p.title}`;
        problemSelect.appendChild(opt);
      }

      if (!problemsCache.length) {
        statusText.textContent = 'No problems found (check /data/problems/<id>/tests)';
        renderEmptyProblem();
        return;
      }

      statusText.textContent = 'Ready';
      await loadProblemDetail(problemSelect.value);
    } catch (e) {
      statusText.textContent = 'Failed to load problems';
      renderEmptyProblem();
      resultBox.textContent = String(e);
    }
  }

  function renderEmptyProblem() {
    problemTitle.textContent = '(no problem)';
    problemId.textContent = '';
    timeLimitPill.textContent = 'Time: -';
    memLimitPill.textContent = 'Memory: -';
    sampleCountPill.textContent = 'Samples: -';
    statementBox.textContent = '(no statement)';
    samplesBox.innerHTML = '<span class="muted">(no samples)</span>';
    langSelect.innerHTML = '';
  }

  function renderProblemInfo(info) {
    currentProblemInfo = info;

    problemTitle.textContent = info.title || info.id;
    problemId.textContent = `(${info.id})`;

    timeLimitPill.textContent = `Time: ${info.time_limit_ms ?? '-'} ms`;
    memLimitPill.textContent = `Memory: ${info.memory_limit_mb ?? '-'} MB`;
    sampleCountPill.textContent = `Samples: ${info.sample_count ?? '-'} shown`;

    statementBox.textContent = info.statement || '(no statement)';

    const samples = info.samples || [];
    if (!samples.length) {
      samplesBox.innerHTML = '<span class="muted">(no samples)</span>';
    } else {
      let html = '';
      for (const s of samples) {
        html += `
          <div class="sample-title">Sample ${escapeHtml(s.name)}</div>
          <div class="two">
            <div>
              <div class="muted small" style="margin:0 0 6px;">Input</div>
              <pre>${escapeHtml(s.input)}</pre>
            </div>
            <div>
              <div class="muted small" style="margin:0 0 6px;">Output</div>
              <pre>${escapeHtml(s.output)}</pre>
            </div>
          </div>
        `;
      }
      samplesBox.innerHTML = html;
    }

    const langs = info.languages || ['python3'];
    langSelect.innerHTML = '';
    for (const l of langs) {
      const opt = document.createElement('option');
      opt.value = l;
      opt.textContent = l;
      langSelect.appendChild(opt);
    }
    if (info.default_language && langs.includes(info.default_language)) {
      langSelect.value = info.default_language;
    }
  }

  async function loadProblemDetail(problemIdValue) {
    if (!problemIdValue) return;
    statusText.textContent = 'Loading problem detail...';
    try {
      const res = await fetch(`/problems/${encodeURIComponent(problemIdValue)}`);
      if (!res.ok) {
        const t = await res.text();
        statusText.textContent = 'Failed to load problem detail';
        resultBox.textContent = t;
        return;
      }
      const info = await res.json();
      renderProblemInfo(info);
      statusText.textContent = 'Ready';
    } catch (e) {
      statusText.textContent = 'Failed to load problem detail';
      resultBox.textContent = String(e);
    }
  }

  function renderResultCard(data) {
    const stRaw = (data?.status || '').toUpperCase();
    const ui = STATUS_TO_UI[stRaw] || { label: stRaw || '(unknown)', cls: 'muted', done: false };

    resultHint.textContent = `Result: ${ui.label}`;
    resultHint.className = `muted ${ui.cls === 'muted' ? '' : ui.cls}`.trim();

    if (data?.submission_id) lastSid.textContent = `submission_id: ${data.submission_id}`;

    statusText.textContent = stRaw ? `Status: ${stRaw}` : 'Status: (unknown)';

    const lines = [];
    lines.push(`status: ${stRaw || '(unknown)'}`);

    const result = data?.result ?? '';
    const detail = data?.detail ?? '';

    if (result) {
      lines.push('');
      lines.push('[result]');
      lines.push(String(result));
    }
    if (detail) {
      lines.push('');
      lines.push('[detail]');
      lines.push(String(detail));
    }

    if (!result && !detail) {
      lines.push('');
      lines.push('[raw]');
      lines.push(JSON.stringify(data, null, 2));
    }

    resultBox.textContent = lines.join('\n');
    return ui.done;
  }

  async function pollResult(sid) {
    // Stop previous polling if any
    if (currentPollAbort) currentPollAbort.abort();
    currentPollAbort = new AbortController();
    const signal = currentPollAbort.signal;

    try {
      while (true) {
        const res = await fetch(`/submissions/${sid}`, { signal });
        if (!res.ok) {
          const t = await res.text();
          statusText.textContent = 'Status: ERROR';
          resultHint.textContent = 'Result: Error';
          resultHint.className = 'muted danger';
          resultBox.textContent = t;
          break;
        }

        const data = await res.json();
        const done = renderResultCard(data);

        if (done) break;
        await new Promise(r => setTimeout(r, 700));
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        statusText.textContent = 'Status: ERROR';
        resultHint.textContent = 'Result: Error';
        resultHint.className = 'muted danger';
        resultBox.textContent = String(e);
      }
    } finally {
      if (currentPollAbort && currentPollAbort.signal === signal) {
        currentPollAbort = null;
      }
    }
  }

  async function submit() {
    const pid = problemSelect.value;
    const lang = langSelect.value;

    if (!pid) {
      alert('문제가 없습니다. 서버의 /data/problems/<id>/tests 를 확인하세요.');
      return;
    }

    statusText.textContent = 'Submitting...';
    resultHint.textContent = '제출 중...';
    resultHint.className = 'muted';
    resultBox.textContent = '(submitting...)';
    lastSid.textContent = '';

    try {
      const res = await fetch(`/problems/${encodeURIComponent(pid)}/submit`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ code: codeArea.value, language: lang })
      });

      if (!res.ok) {
        const t = await res.text();
        statusText.textContent = 'Submit failed';
        resultHint.textContent = '제출 실패';
        resultHint.className = 'muted danger';
        resultBox.textContent = t;
        return;
      }

      const data = await res.json();
      const sid = data.submission_id;

      lastSid.textContent = sid ? `submission_id: ${sid}` : '';
      statusText.textContent = 'Submitted';
      resultHint.textContent = '결과 대기 중...';
      resultHint.className = 'muted';

      await pollResult(sid);
    } catch (e) {
      statusText.textContent = 'Submit error';
      resultHint.textContent = '제출 중 오류';
      resultHint.className = 'muted danger';
      resultBox.textContent = String(e);
    }
  }

  submitBtn.addEventListener('click', submit);
  problemSelect.addEventListener('change', async () => {
    await loadProblemDetail(problemSelect.value);
  });

  loadProblems();
</script>
</body>
</html>
