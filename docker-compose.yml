services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - redis
    ports:
      - "80:8000"

  worker:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && python worker.py"
    depends_on:
      - redis
